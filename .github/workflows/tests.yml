name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow manual runs from the GitHub UI
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.tox_env }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 is no longer on the newest Ubuntu images
          - python-version: "3.8"
            tox_env: qa
            os: ubuntu-22.04
          - python-version: "3.9"
            tox_env: qa
          - python-version: "3.10"
            tox_env: qa
          - python-version: "3.11"
            tox_env: qa
          - python-version: "3.12"
            tox_env: qa
          - python-version: "3.13"
            tox_env: qa
          - python-version: "3.14"
            tox_env: qa

          # Make sure everything still works without lxml
          - python-version: "3.14"
            tox_env: minimal

          - python-version: "3.14"
            tox_env: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install tox

      - name: Run tox for ${{ matrix.tox_env }}
        run: tox -e ${{ matrix.tox_env }}
