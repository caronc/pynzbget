[tox]
envlist =
    qa
    minimal
    lint
minversion = 4.0
isolated_build = True

# Run the tests (with coverage)
[testenv:qa]
description = Run the tests with coverage
extras = dev
commands =
    coverage run -m pytest {posargs}
    coverage report

# Run the tests without lxml; this is how pynzbget runs when it's bundled
# into an NZBGet extension
[testenv:minimal]
description = Run the tests without lxml installed
extras = dev
commands_pre =
    pip uninstall -y lxml
commands =
    pytest {posargs}

[testenv:lint]
description = Check for lint and style problems (read-only)
skip_install = true
deps = ruff==0.15.8
commands =
    ruff check . {posargs}

[testenv:format]
description = Fix the lint problems ruff can fix for you
skip_install = true
deps = ruff==0.15.8
commands =
    ruff check . --fix {posargs}

[testenv:build]
description = Build the wheel and source package into dist/
skip_install = true
deps = build
commands =
    python -m build
