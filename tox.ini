[tox]
envlist =
    qa
    minimal
    lint
minversion = 4.0
isolated_build = True

# Settings every environment below shares
[testenv]
changedir = {toxinidir}
# Several environments call tools such as docker, rpmbuild or tox itself
allowlist_externals = *

#
# Testing
#

# Run the tests (with coverage)
[testenv:qa]
description = Run the tests with coverage
extras = dev
commands =
    coverage run -m pytest {posargs}
    coverage report

# Run the tests without lxml; this is how pynzbget runs when it's bundled
# into an NZBGet extension
[testenv:minimal]
description = Run the tests without lxml installed
extras = dev
commands_pre =
    pip uninstall -y lxml
commands =
    pytest {posargs}

[testenv:lint]
description = Check for lint and style problems (read-only)
skip_install = true
deps = ruff==0.15.8
commands =
    ruff check . {posargs}

[testenv:format]
description = Fix the lint problems ruff can fix for you
skip_install = true
deps = ruff==0.15.8
commands =
    ruff check . --fix {posargs}

#
# Packaging
#

[testenv:clean]
description = Remove build files, caches and everything in dist/
skip_install = true
commands =
    rm -rf build dist pynzbget.egg-info .coverage .pytest_cache .ruff_cache __pycache__
    find nzbget test -type f -name "*.py[co]" -delete
    find nzbget test -type d -name __pycache__ -delete

[testenv:validate]
description = Check pyproject.toml is valid
skip_install = true
deps = validate-pyproject[all]
commands =
    validate-pyproject pyproject.toml

# Build the source package and the wheel into dist/
[testenv:build]
description = Build the source package and wheel into dist/
skip_install = true
deps = build
commands =
    python -m build

[testenv:build-sdist]
description = Build just the source package into dist/
skip_install = true
deps = build
commands =
    python -m build --sdist

[testenv:build-wheel]
description = Build just the wheel into dist/
skip_install = true
deps = build
commands =
    python -m build --wheel

# Make sure PyPI will accept (and properly show) what we built
[testenv:twine-check]
description = Check the files in dist/ before uploading them
skip_install = true
deps = twine
commands =
    twine check dist/*.whl dist/*.tar.gz

#
# RPM packaging
#

# Build the source RPM (for COPR) with this machine's rpmbuild
[testenv:build-src-rpm]
description = Build the source RPM into dist/rpm/ (needs rpmbuild)
skip_install = true
commands_pre =
    mkdir -p {envtmpdir}/rpmbuild/SOURCES dist/rpm
    bash -c 'cp dist/pynzbget-*.tar.gz {envtmpdir}/rpmbuild/SOURCES/'
commands =
    rpmbuild --nodeps -bs \
        --define "_topdir {envtmpdir}/rpmbuild" \
        --define "_srcrpmdir {toxinidir}/dist/rpm" \
        packaging/redhat/python-nzbget.spec

# Build and test the RPMs inside each distribution's container (needs
# docker); the RPMs land in dist/rpm/<distribution>/
[testenv:build-el9-rpm]
description = Build the RPMs for RHEL/Rocky 9 (needs docker)
skip_install = true
deps = build
commands =
    python -m build --sdist
    docker compose run --build --rm rpmbuild.el9 bin/build-rpm.sh

[testenv:build-el10-rpm]
description = Build the RPMs for RHEL/Rocky 10 (needs docker)
skip_install = true
deps = build
commands =
    python -m build --sdist
    docker compose run --build --rm rpmbuild.el10 bin/build-rpm.sh

[testenv:build-f44-rpm]
description = Build the RPMs for Fedora 44 (needs docker)
skip_install = true
deps = build
commands =
    python -m build --sdist
    docker compose run --build --rm rpmbuild.f44 bin/build-rpm.sh

[testenv:rpm]
description = Build the RPMs for every distribution (needs docker)
skip_install = true
commands =
    tox -e build-el9-rpm
    tox -e build-el10-rpm
    tox -e build-f44-rpm

#
# Everything for a release, in order
#
[testenv:release]
description = Clean, test, build and check everything for a release
skip_install = true
commands =
    tox -e clean
    tox -e lint
    tox -e qa
    tox -e minimal
    tox -e validate
    tox -e build
    tox -e twine-check
    tox -e build-src-rpm
